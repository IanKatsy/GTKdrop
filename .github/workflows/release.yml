# Builds GTKdrop for a version tag and publishes it as a GitHub Release with a tarball
# (GTKdrop-<version>-linux-x86_64.tar.gz: the binary, README.txt and LICENSE).
#
# Runs when a v* tag is pushed, or by hand (Actions -> Release -> Run workflow) for a tag that already exists.
# Built in an Arch Linux container: Ubuntu's GTK and libadwaita are too old, and building them from source on
# every release would be slow.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (e.g. v0.3.1)
        required: true

permissions:
  contents: write # create the release and upload the tarball

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install build tools and libraries
        run: >
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja git github-cli
          gtk4 libadwaita libsoup3 libsecret webkitgtk-6.0 nlohmann-json

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # the version's third part counts commits since the vMAJOR.MINOR tag

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package
        run: |
          version=$(sed -n 's/^#define GTKDROP_VERSION "\(.*\)"$/\1/p' build/generated/version.h)
          dir="GTKdrop-$version"
          mkdir "$dir"
          install -m 755 -s build/GTKdrop "$dir/GTKdrop"
          sed "s/@VERSION@/$version/" packaging/README.txt > "$dir/README.txt"
          cp LICENSE "$dir/"
          tar czf "$dir-linux-x86_64.tar.gz" "$dir"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=$dir-linux-x86_64.tar.gz" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --title "GTKdrop $VERSION" \
              --generate-notes
          fi
